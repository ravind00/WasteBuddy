<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waste Buddy - Verified!</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="mobile-frame success-page">
        <div class="bg-wrapper" style="background:var(--dark-bg)"></div>
        <div class="success-body">
            <div class="success-icon"><i class="fa-solid fa-check"></i></div>
            <h2>Disposal Verified!</h2>
            <p class="sub">Thank you for keeping our<br>environment clean.</p>
            <div class="earned-badge">
                <div style="font-size:12px;color:rgba(255,255,255,.6);margin-bottom:4px">You Earned</div>
                <div class="pts">+<span id="pts-earned">10</span> PTS</div>
            </div>
            <div class="total-pts">Total Points: <strong id="total-pts">130</strong> PTS</div>
            <div class="success-actions">
                <button class="btn-primary" onclick="window.location.href='home.html'">
                    <i class="fa-solid fa-camera" style="margin-right:6px"></i> Scan Another Waste
                </button>
                <button class="btn-outline" style="color:#fff;border-color:rgba(255,255,255,.3)" onclick="window.location.href='history.html'">
                    View History
                </button>
            </div>
        </div>
    </div>
<script>
document.addEventListener('DOMContentLoaded',function(){
    const earned=localStorage.getItem('verify_points_earned')||'10';
    const total=localStorage.getItem('user_points')||'0';
    document.getElementById('pts-earned').textContent=earned;
    document.getElementById('total-pts').textContent=total;
});
</script>
</body>
</html>
